server:
  port: 8081
  shutdown: "graceful"

management:
  endpoint:
    health:
      show-details: "always"
  endpoints:
    web:
      base-path: /
      exposure:
        include: health, info, prometheus

springdoc:
  packagesToScan: uk.gov.hmcts.apim.controllers
  writer-with-order-by-keys: true

spring:
  application:
    name: API Marketplace Examples
